/* ---- sound: broth, rain, bells (off until you turn it on) ---- */
let actx = null, soundOn = false, rainGain = null, roomGain = null;

  rainGain = loop("bandpass", 2600, .5); roomGain = loop("lowpass", 420, .7);
  setInterval(() => { // broth bubbles inside
    if (!soundOn || window.agentView !== "inside") return;
    for (let i = 0; i < 2; i++) if (Math.random() < .6) { const t = actx.currentTime + Math.random() * .5, o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.setValueAtTime(180 + Math.random() * 260, t); o.frequency.exponentialRampToValueAtTime(600 + Math.random() * 500, t + .06); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .09); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .1); }
  }, 500);
}

  if (!actx) return;
  const t = actx.currentTime, inside = window.agentView === "inside";
  rainGain.gain.setTargetAtTime(soundOn && window.agentRain ? (inside ? .025 : .09) : 0, t, .4);
  roomGain.gain.setTargetAtTime(soundOn && inside ? .05 : 0, t, .4);
}
window.agentMix = mixSound;
function sfx(kind) {

  const t = actx.currentTime;
  const tones = kind === "bell" ? [[1320, .9], [1980, .5], [2640, .25]] : [[1760, .4], [2640, .2]];
  tones.forEach(([f, a]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08 * a, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + (kind === "bell" ? 1.6 : .7)); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 1.7); });

/* ---- keyboard shortcuts ---- */
addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("input, textarea")) { if (e.key === "Escape") closeOrder(); return; }
  if (e.key === "Escape") { if (!hqEl.hidden) closeHQ(); else if (!orderEl.hidden) closeOrder(); else if (window.agentView === "inside") document.getElementById("backBtn").click(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "m") toggleSound();
  if (window.agentView === "inside" && k === "o") { e.preventDefault(); openHQ(); }
  if (window.agentView !== "inside" && (k === "enter" || k === "e")) { e.preventDefault(); window.agentEnter && window.agentEnter(); }

      guests.forEach((g, i) => { g.userData.armR.rotation.x = -1.1 + Math.max(0, Math.sin(tt * 2 + i * 1.7)) * .5; g.rotation.z = Math.sin(tt * .7 + i) * .02; });
      paw.position.y = .62 + Math.max(0, Math.sin(tt * 3)) * .12;
    });
    return {
      tick(tt, dt) { ticks.forEach(f => f(tt, dt)); },
      setDay(d, r) { nightOnly.forEach(o => { if (o.isSprite) o.material.opacity = d ? o.userData.base * .25 : o.userData.base; else o.visible = !d; }); stars.visible = moon.visible = !d && !r; streetLight.intensity = d ? .1 : .7; lanternMat.emissiveIntensity = d ? .35 : .9; },
    };
  })();

  // lights: cool night fill, a key light, warm glow from the counter and lantern
  const hemi = new THREE.HemisphereLight("#b9c3ff", "#4a3a3a", .55); scene.add(hemi);
  const key = new THREE.DirectionalLight("#fff0dc", .8); key.position.set(-12, 22, 16); key.castShadow = true; key.shadow.mapSize.set(innerWidth < 700 ? 1024 : 2048, innerWidth < 700 ? 1024 : 2048);
  Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 }); key.shadow.bias = -.0005; key.shadow.normalBias = .03; scene.add(key);
  const rim = new THREE.DirectionalLight("#7fd0c8", .35); rim.position.set(14, 8, -10); scene.add(rim);
  const warm = new THREE.PointLight("#ffb168", 1.8, 16, 1.5); warm.position.set(0, 3.6, 1); scene.add(warm);
  const warm2 = new THREE.PointLight("#ffb168", .8, 9, 1.6); warm2.position.set(0, 2.6, 5.4); scene.add(warm2);
  const lampL = new THREE.PointLight("#ffc98a", .9, 9, 1.6); lampL.position.set(-7.3, 3.3, 4.6); scene.add(lampL);

  // hover + click the door (or the noren) to go inside
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), clickables = [door, doorNoren, ...noren];
  let hover = false, inside = false, zoom = null, downAt = null;
  const pick = e => { const r = renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mouse, camera); return ray.intersectObjects(clickables).length > 0; };
  renderer.domElement.addEventListener("pointermove", e => { hover = pick(e); renderer.domElement.style.cursor = hover ? "pointer" : "grab"; });
  renderer.domElement.addEventListener("pointerdown", e => downAt = [e.clientX, e.clientY]);
  renderer.domElement.addEventListener("pointerup", e => { if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5 && pick(e)) goInside(); });
  hint.onclick = () => goInside();
  window.agentView = "outside"; window.agentEnter = goInside; window.agentRain = false;
  // day / night and rain
  let day = false, rain = false;
  const rainGeo = new THREE.BufferGeometry(), RN = 700, rp = new Float32Array(RN * 6);
  for (let i = 0; i < RN; i++) { const x = -12 + rnd() * 26, y = rnd() * 20, z = -9 + rnd() * 21; rp.set([x, y, z, x - .05, y - .7, z + .03], i * 6); }
  rainGeo.setAttribute("position", new THREE.BufferAttribute(rp, 3));
  const rainLines = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: "#b8c6e6", transparent: true, opacity: .55 })); rainLines.visible = false; rainLines.frustumCulled = false; scene.add(rainLines);
  const dayBtn = document.getElementById("dayBtn"), rainBtn = document.getElementById("rainBtn");
  function applySky() {
    const bg = day ? (rain ? "#8c98a8" : "#a9cbe9") : (rain ? "#24283a" : "#2b2a3c");
    scene.background.set(bg); outside.style.background = bg;
    hemi.color.set(day ? "#e4ecff" : "#b9c3ff"); hemi.groundColor.set(day ? "#8a7a5a" : "#4a3a3a"); hemi.intensity = day ? .95 : .55;
    key.color.set(day ? "#fff4e0" : "#fff0dc"); key.intensity = (day ? 1.15 : .8) * (rain ? .6 : 1);
    warm.intensity = day ? .7 : 1.5; warm2.intensity = day ? .3 : .8; lampL.intensity = day ? .3 : .9;
    lantern.userData.base = day ? .3 : .7;
    cozy.setDay(day, rain);
    rainLines.visible = rain; window.agentRain = rain; window.agentMix && window.agentMix();
    dayBtn.setAttribute("aria-pressed", day); dayBtn.textContent = day ? "☾ Night" : "☀ Day"; rainBtn.setAttribute("aria-pressed", rain);
  }
  dayBtn.onclick = () => { day = !day; applySky(); };
  rainBtn.onclick = () => { rain = !rain; applySky(); };
  lantern.userData.base = .7;
  function goInside() {
    if (inside || zoom) return;
    const tgt = new THREE.Vector3(5.2, 1.6, .9);
    zoom = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(11, 2.6, 1.4), t1: tgt, k: 0 };
    if (reduce3) zoom.k = 1;
  }
  function finishInside() { fade.style.opacity = 1; setTimeout(() => { outside.hidden = true; inside = true; window.agentView = "inside"; window.agentMix && window.agentMix(); document.getElementById("backBtn").focus({ preventScroll: true }); fade.style.opacity = 0; }, reduce3 ? 0 : 380); }
  document.getElementById("backBtn").onclick = () => {
    fade.style.opacity = 1;
    setTimeout(() => { outside.hidden = false; inside = false; window.agentView = "outside"; window.agentMix && window.agentMix(); camera.position.copy(HOME.p); controls.target.copy(HOME.t); fade.style.opacity = 0; requestAnimationFrame(loop); }, reduce3 ? 0 : 380);
  };

  function resize() { const w = outside.clientWidth || 1, h = outside.clientHeight || 1; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? Math.min(52, 27 / Math.pow(w / h, .75)) : 27; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(outside); resize();
  const v = new THREE.Vector3(), clock = new THREE.Clock();
  function loop() {
    if (inside) return;
    const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
    doorMat.emissiveIntensity += ((hover ? .45 : .08 + Math.sin(t * 2.4) * .06) - doorMat.emissiveIntensity) * .15;
    if (!reduce3) noren.forEach((m, i) => { m.rotation.x = Math.sin(t * 1.3 + i * .8) * .05; });
    lantern.material.emissiveIntensity = lantern.userData.base + (reduce3 ? 0 : Math.sin(t * 6) * .04 + Math.sin(t * 11) * .03);
    cozy.tick(t, dt);
    if (rain && !reduce3) { const a = rainGeo.attributes.position.array; for (let i = 0; i < RN; i++) { const k = i * 6; a[k + 1] -= dt * 22; a[k + 4] -= dt * 22; if (a[k + 4] < 0) { a[k + 1] += 20; a[k + 4] += 20; } } rainGeo.attributes.position.needsUpdate = true; }
    if (zoom) {
      zoom.k = Math.min(1, zoom.k + dt / 1.1); const e = zoom.k < .5 ? 4 * zoom.k ** 3 : 1 - (-2 * zoom.k + 2) ** 3 / 2;
      camera.position.lerpVectors(zoom.p0, zoom.p1, e); controls.target.lerpVectors(zoom.t0, zoom.t1, e);
      if (zoom.k >= .8 && !zoom.faded) { zoom.faded = true; finishInside(); }
      if (zoom.k >= 1) zoom = null;
    }
    controls.update();
    v.set(5.25, 3.2, .9).project(camera);
    hint.style.left = (v.x + 1) / 2 * outside.clientWidth + "px"; hint.style.top = (1 - v.y) / 2 * outside.clientHeight + "px";
    hint.hidden = !!zoom || v.z > 1;
    renderer.render(scene, camera);
    if (!loop.drawn) { loop.drawn = true; const ld = document.getElementById("loading"); ld.style.opacity = 0; setTimeout(() => ld.hidden = true, 450); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
